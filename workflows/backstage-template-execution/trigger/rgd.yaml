---
# BackstageTemplateRun — a kro ResourceGraphDefinition that bundles the
# ConfigMap (input.json + start script) and the trigger Job (runs the script:
# curl → dapr sidecar) for starting a BackstageTemplateWorkflow run. One small CR replaces ~60
# lines of CM+Job boilerplate.
#
# Delivery: each release publishes this file alone as
#   <worker kustomize repo>:<release-tag>-trigger
# and the stuttgart-things/flux component dapr-workflows-trigger applies it
# behind kro. Without Flux:
#   1. install kro (flux/cicd/kro)
#   2. kubectl apply -f rgd.yaml                  # installs the CRD
#   3. kubectl apply -f examples/<your-run>.yaml  # triggers a run
#
# Keep ${...} out of anything Flux substitutes. The expressions below are
# kro's, and a Kustomization with postBuild.substitute would rewrite them; the
# Kustomization that applies this artifact has none, on purpose.
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: backstage-template-run
spec:
  schema:
    apiVersion: v1alpha1
    kind: BackstageTemplateRun
    spec:
      # Workflow addressing
      workflowName: string | default="BackstageTemplateWorkflow" description="Dapr workflow name registered by the worker"
      sidecarService: string | default="backstage-template-execution-dapr.backstage-workflows.svc.cluster.local" description="In-cluster DNS name of the daprd sidecar service"
      sidecarPort: integer | default=3500 description="Dapr HTTP port. The <app-id>-dapr svc is headless so DNS resolves to the pod IP; connect on the sidecar's actual listen port (3500)."
      triggerImage: string | default="curlimages/curl:8.11.1" description="Image used by the trigger Job"

      # Workflow input — shape is the same as dapr-workflows/backstage-template-execution/input.json
      # default="" rather than required=false. The endpoint is per-lab and the
      # worker reads it from BACKSTAGE_URL in its own environment, so a CR that
      # omits it must work -- but a merely OPTIONAL field is not enough: the
      # marshal below dereferences it, and kro fails an unset key outright:
      #   failed to evaluate expression: ... no such key: backstageURL
      # The instance then hangs in IN_PROGRESS with no ConfigMap and no Job.
      # A default makes the key always present; "" is what the worker treats
      # as "not given", so the env fallback applies. Verified on a live cluster.
      backstageURL: string | default="" description="Base URL of the Backstage instance. Leave unset to use the worker's BACKSTAGE_URL (per-lab, set by the cluster)"
      templateRef: string | required=true description="Backstage template entity ref, e.g. template:default/create-terraform-vm"
      dryRun: boolean | default=true description="If true the worker stops before any mutating step"
      values: object | required=true description="Template values — free-form, shape depends on the Backstage template"
      # Optional, because the Go type is: `Watch *GitHubWatch json:"watch,omitempty"`
      # and the workflow returns right after the scaffolder when it is nil
      # (main.go). Requiring it here contradicted the code and made the
      # cheapest useful CR -- a dryRun smoke test, which never reaches the
      # watch -- fail schema validation, so the only way to try the trigger
      # path was to invent a watch block that nothing reads.
      watch: object | required=false description="GitHub Actions watch config (owner/repo/workflowFile/branch/timeoutMin/merge). Omit to stop after the scaffolder task completes."
      # A CR kept in git outlives the state store that remembers it ran: a
      # rebuilt cluster has an empty Redis, Flux applies every CR still in the
      # repository, and the existence check below finds nothing. notAfter is the
      # part of that memory that travels with the CR -- whoever renders it
      # stamps a deadline, and past it the Job refuses to start. default="" for
      # the same reason as backstageURL: an unset key fails the expression.
      notAfter: string | default="" description="UTC deadline, YYYY-MM-DDTHH:MM:SSZ. After it the trigger Job does not start the workflow. Empty means no deadline."

    status:
      jobName: ${trigger.metadata.name}
      succeeded: ${trigger.status.succeeded}
      failed: ${trigger.status.failed}

  resources:
    # ConfigMap with everything the trigger needs: the serialized workflow
    # input, the deadline and the start script itself. json.marshal turns the
    # free-form `values` / `watch` maps into a single string that the script
    # POSTs verbatim to the dapr sidecar (no envsubst, no escaping).
    #
    # The script lives here and not in the Job because a ConfigMap can be
    # updated in place and a Job's pod template cannot. See the trigger below.
    - id: input
      template:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: ${schema.metadata.name}-input
        data:
          input.json: |
            ${json.marshal(has(schema.spec.watch) ? {"backstageURL": schema.spec.backstageURL, "templateRef": schema.spec.templateRef, "dryRun": schema.spec.dryRun, "values": schema.spec.values, "watch": schema.spec.watch} : {"backstageURL": schema.spec.backstageURL, "templateRef": schema.spec.templateRef, "dryRun": schema.spec.dryRun, "values": schema.spec.values})}
          # notAfter (see the schema) is free text from the CR, so it arrives
          # as a file the script reads rather than spliced into the script.
          not-after: ${schema.spec.notAfter}
          # Start once per CR, however often a trigger Job runs.
          #
          # The instance ID is <namespace>_<name>, no longer <name>-<epoch>. A
          # timestamp made every run of the Job a new instance, so every
          # recreation of the Job -- by kro, or by Flux re-applying a CR
          # someone deleted -- scaffolded the template again.
          #
          # A fixed ID alone does not stop that: Dapr 1.18 accepts a start on
          # an existing ID and, if the instance has finished, runs it again
          # with the new input (HTTP 202 both times; verified on
          # cicd-machinery-test5). So the script asks first and only starts on
          # a clean ERR_INSTANCE_ID_NOT_FOUND. Anything else -- sidecar not
          # reachable, an unexpected status -- fails the Job rather than
          # starting blind.
          #
          # `_` because Kubernetes names cannot contain it, so no two
          # namespace/name pairs map to the same ID; Dapr rejects `.`. Not
          # metadata.uid: a CR that Flux re-creates gets a new uid, and that is
          # exactly the case this has to catch.
          #
          # The memory is the Dapr state store. A purged instance, or a rebuilt
          # cluster with an empty Redis, starts again.
          #
          # notAfter is checked before anything else.
          #
          # Changing this script changes only this ConfigMap. Jobs that have
          # already run keep their result and are not touched; the next Job to
          # run reads the new version.
          start.sh: |
            set -eu
            INSTANCE_ID="${schema.metadata.namespace}_${schema.metadata.name}"
            WORKFLOWS="http://${schema.spec.sidecarService}:${string(schema.spec.sidecarPort)}/v1.0-beta1/workflows/dapr"

            not_after=$(cat /input/not-after)
            if [ -n "$not_after" ]; then
              if ! deadline=$(date -u -D '%Y-%m-%dT%H:%M:%SZ' -d "$not_after" +%s 2>/dev/null); then
                echo "notAfter '$not_after' is not YYYY-MM-DDTHH:MM:SSZ, refusing to start"
                exit 1
              fi
              if [ "$(date -u +%s)" -gt "$deadline" ]; then
                echo "notAfter $not_after has passed, not starting $INSTANCE_ID"
                exit 0
              fi
            fi

            # Retried, and only this idempotent GET: right after a worker
            # (re)start the sidecar is not up yet (connection refused), and a
            # headless <app-id>-dapr can still resolve to the terminating pod
            # (connect timeout). The POST below is NOT retried, so a start can
            # never be sent twice; once this GET answers, the sidecar is there.
            code=$(curl -sS --connect-timeout 5 --retry 12 --retry-delay 5 --retry-connrefused \
              -o /tmp/instance.json -w '%{http_code}' "$WORKFLOWS/$INSTANCE_ID")
            if [ "$code" = 200 ]; then
              echo "instance $INSTANCE_ID already exists, not starting it again"
              grep -o '"runtimeStatus":"[^"]*"' /tmp/instance.json || true
              exit 0
            fi
            if [ "$code" != 404 ] || ! grep -q ERR_INSTANCE_ID_NOT_FOUND /tmp/instance.json; then
              echo "cannot tell whether $INSTANCE_ID exists (HTTP $code), refusing to start"
              cat /tmp/instance.json
              echo
              exit 1
            fi

            echo "starting workflow instance: $INSTANCE_ID"
            curl -fsS -X POST \
              "$WORKFLOWS/${schema.spec.workflowName}/start?instanceID=$INSTANCE_ID" \
              -H "Content-Type: application/json" \
              --data-binary @/input/input.json
            echo
            echo "instance started: $INSTANCE_ID"

    # Trigger Job -- mounts the ConfigMap and runs /input/start.sh once. It
    # stays Complete until the BackstageTemplateRun CR is deleted, which tears
    # down both CM + Job. Why there is no TTL: see spec below.
    #
    # Two rules keep this Job from breaking the CR on an RGD update:
    #
    # 1. Nothing that a release changes lives in the pod template. A Job's
    #    spec.template is immutable, and kro applies every template change to
    #    every existing instance. While the script sat in the command, each
    #    new script made every CR's long-finished Job fail to apply
    #    (`spec.template: ... field is immutable`), and the CR went to ERROR.
    # 2. What can still change goes into the NAME, as a short hash: the CR's
    #    triggerImage, and the marker "trigger-v1" for the template itself.
    #    A change then means a new Job instead of an impossible update, and
    #    kro prunes the old one. The new Job finds the instance through the
    #    GET in start.sh and exits without starting anything -- the same path
    #    as a Job deleted by hand.
    #
    # A new triggerImage DEFAULT does not reach existing CRs: the API server
    # stored the default in each CR when it was created.
    #
    # Change anything else in this pod template (command, volumes, a
    # securityContext) and you MUST bump "trigger-v1", or every existing CR
    # goes to ERROR on the next release.
    - id: trigger
      template:
        apiVersion: batch/v1
        kind: Job
        metadata:
          # <name>-<8 hex>: the CR name may be at most 54 characters.
          name: ${schema.metadata.name}-${"%x".format([hash.sha256("trigger-v1 " + schema.spec.triggerImage)]).substring(0, 8)}
        spec:
          # NO ttlSecondsAfterFinished. kro owns this Job: when the TTL deleted
          # it, kro saw a managed resource missing and recreated it, and the new
          # Job started a NEW workflow instance that scaffolded the template
          # again. Every CR became a loop with a five-minute period -- 237
          # scaffolder tasks in 20 hours on labda-dev-a before anyone noticed.
          # The GET in start.sh stops the re-run now, but a TTL would still
          # mean a pod per CR every five minutes, forever, and a re-run as soon
          # as the state store forgets. A Complete Job that stays is the price
          # of a CR that triggers once; it goes away with the CR.
          backoffLimit: 0
          template:
            spec:
              restartPolicy: Never
              volumes:
                - name: input
                  configMap:
                    name: ${input.metadata.name}
              containers:
                - name: trigger
                  image: ${schema.spec.triggerImage}
                  volumeMounts:
                    - name: input
                      mountPath: /input
                      readOnly: true
                  command: ["sh", "/input/start.sh"]
