---
# Watch the ClusterStack u26-kind1 being built: first until the Argo CD
# Application that carries it has applied the merge commit, then through the
# XR's stages to Ready.
#
# Unlike a BackstageTemplateRun this example is harmless to apply -- it only
# reads. Adjust the names: the Application and the merge SHA are whatever your
# Backstage template / PR produced.
apiVersion: kro.run/v1alpha1
kind: ClusterBuildWatch
metadata:
  name: u26-kind1
  namespace: cluster-build-watch
spec:
  displayName: u26-kind1 (proxmox / k3s)
  gitops:
    kind: argocd
    namespace: argocd
    name: clusterstack-u26-kind1
    revision: 0123456789abcdef0123456789abcdef01234567  # pragma: allowlist secret (the merge commit)
  target:
    namespace: crossplane-system
    name: u26-kind1
    # Only where the built-in limits do not fit. Keys are status.stage values.
    stageTimeoutMin:
      distribution: 45
      platform: 60
  timeoutMin: 240
